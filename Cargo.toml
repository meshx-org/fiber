[workspace]
members = [
  #"crates/flow-compiler",
  #"crates/flow-component",
  #"crates/flow-runtime",
  "crates/data",
  "crates/schema-manager",
  "crates/schema-provider",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
cedar-policy = "4"
itertools = "0.12"
murmur3 = "0.5"
serde = {version = "1", features = ["derive"]}
serde_cbor = "0.11"
serde_json = "1"
sqlparser = "0.53"
sqlx = {version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros"]}
thiserror = "2"
tokio = {version = "1.36", features = ["macros", "rt-multi-thread"]}
wit-bindgen = "0.51"
wit-bindgen-rt = {version = "0.44", features = ["bitflags"]}
wit-bindgen-wrpc = "0.10.0"
wstd = {version = "0.6.5"}
