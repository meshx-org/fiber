[package]
name = "http-middleware"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "component:http-middleware"
# This tells cargo-component to use a special adapter, which doesn't depend on
# `get-environment` or other things not present in the proxy world.
proxy = true

[dependencies]
wit-bindgen = { workspace = true }
wit-bindgen-rt = { workspace = true, features = ["bitflags"] }
wstd = { workspace = true }